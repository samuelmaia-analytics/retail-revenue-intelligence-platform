name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run Ruff
        run: ruff check src tests app main.py

      - name: Check Black formatting
        run: black --check src tests app main.py

      - name: Validate versioned Olist sample
        shell: bash
        run: |
          sample_dir="data/sample/olist"
          required_files=(
            "olist_customers_dataset.csv"
            "olist_geolocation_dataset.csv"
            "olist_orders_dataset.csv"
            "olist_order_items_dataset.csv"
            "olist_order_payments_dataset.csv"
            "olist_order_reviews_dataset.csv"
            "olist_products_dataset.csv"
            "olist_sellers_dataset.csv"
            "product_category_name_translation.csv"
          )

          missing_files=()
          for filename in "${required_files[@]}"; do
            if [[ ! -f "$sample_dir/$filename" ]]; then
              missing_files+=("$sample_dir/$filename")
            fi
          done

          if (( ${#missing_files[@]} > 0 )); then
            echo "::error::The full Olist dataset is not stored in GitHub and the versioned sample is incomplete."
            printf 'Missing required sample file: %s\n' "${missing_files[@]}"
            exit 1
          fi

      - name: Load raw data
        run: python src/ingestion/load_to_duckdb.py --mode sample

      - name: Build staging layer
        run: python src/transformation/run_staging.py

      - name: Build marts layer
        run: python src/transformation/run_marts.py

      - name: Export Power BI tables
        run: python src/transformation/export_powerbi_tables.py

      - name: Run pytest
        run: pytest
