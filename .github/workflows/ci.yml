name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Prepare Olist input data
        shell: bash
        run: |
          set -euo pipefail

          raw_dir="data/raw/Brazilian E-commerce"
          sample_dir="data/sample/olist"
          required_files=(
            "olist_customers_dataset.csv"
            "olist_geolocation_dataset.csv"
            "olist_orders_dataset.csv"
            "olist_order_items_dataset.csv"
            "olist_order_payments_dataset.csv"
            "olist_order_reviews_dataset.csv"
            "olist_products_dataset.csv"
            "olist_sellers_dataset.csv"
            "product_category_name_translation.csv"
          )

          missing_raw=()
          for filename in "${required_files[@]}"; do
            if [[ ! -f "${raw_dir}/${filename}" ]]; then
              missing_raw+=("${filename}")
            fi
          done

          if (( ${#missing_raw[@]} == 0 )); then
            echo "Using the complete Olist CSV files from ${raw_dir}."
            exit 0
          fi

          echo "Complete Olist data is not available in CI."
          echo "Using the versioned Olist sample from ${sample_dir}."

          missing_sample=()
          for filename in "${required_files[@]}"; do
            if [[ ! -f "${sample_dir}/${filename}" ]]; then
              missing_sample+=("${filename}")
            fi
          done

          if (( ${#missing_sample[@]} > 0 )); then
            printf 'ERROR: missing required sample file: %s\n' "${missing_sample[@]}"
            echo "Download the Olist dataset manually or restore data/sample/olist/."
            exit 1
          fi

          mkdir -p "${raw_dir}"
          cp "${sample_dir}"/*.csv "${raw_dir}/"

      - name: Run Ruff
        run: ruff check src tests main.py

      - name: Check Black formatting
        run: black --check src tests main.py

      - name: Load raw data
        run: python src/ingestion/load_to_duckdb.py

      - name: Build staging layer
        run: python src/transformation/run_staging.py

      - name: Build marts layer
        run: python src/transformation/run_marts.py

      - name: Export Power BI tables
        run: python src/transformation/export_powerbi_tables.py

      - name: Run pytest
        run: pytest
