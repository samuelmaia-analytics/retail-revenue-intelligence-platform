name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run Ruff
        run: ruff check src tests main.py

      - name: Check Black formatting
        run: black --check src tests main.py

      - name: Load raw data
        run: python src/ingestion/load_to_duckdb.py --mode sample

      - name: Build staging layer
        run: python src/transformation/run_staging.py

      - name: Build marts layer
        run: python src/transformation/run_marts.py

      - name: Export Power BI tables
        run: python src/transformation/export_powerbi_tables.py

      - name: Run pytest
        run: pytest
